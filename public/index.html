<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- App Bar -->
  <nav class="appbar">
    <div class="brand-name">TodoHack</div>
    <div class="nav-right">
      <a href="showtasks.html">Show Your Todos</a>
    </div>
  </nav>

  <div class="container">
    <!-- Left Side: Form Section -->
    <div class="left-section">
      <div class="form-container">
        <h1>Task Manager</h1>
        <form id="task-form" onsubmit="event.preventDefault(); addTask();">
          <input type="text" id="task-title" placeholder="Task Title" required />
          <textarea id="task-description" placeholder="Task Description" required></textarea>
          <input type="datetime-local" id="task-datetime" required />
          <button type="submit">Add Task</button>
          <div id="form-message" style="margin-top: 10px;"></div>
        </form>
      </div>
    </div>
  
    <!-- Right Side: Task List Section -->
    <div class="right-section">
      <div class="task-list" id="task-list">
        <div id="loading-message">Loading tasks...</div>
        <div id="error-message" style="color: red; display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    // Use your Render backend URL
    const apiUrl = 'https://todo-backend-fkid.onrender.com/tasks';
    
    // DOM elements
    const taskForm = document.getElementById('task-form');
    const taskList = document.getElementById('task-list');
    const formMessage = document.getElementById('form-message');
    const loadingMessage = document.getElementById('loading-message');
    const errorMessage = document.getElementById('error-message');

    // Load tasks when page loads
    document.addEventListener('DOMContentLoaded', fetchTasks);

    // Fetch and display tasks
    async function fetchTasks() {
      try {
        showLoading();
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const tasks = await response.json();
        renderTasks(tasks);
      } catch (error) {
        console.error('Error fetching tasks:', error);
        showError('Failed to load tasks. Please try again later.');
      } finally {
        hideLoading();
      }
    }

    // Render tasks to the DOM
    function renderTasks(tasks) {
      // Clear existing tasks but keep messages
      taskList.innerHTML = '';
      taskList.appendChild(loadingMessage);
      taskList.appendChild(errorMessage);
      errorMessage.style.display = 'none';

      if (tasks.length === 0) {
        const emptyMsg = document.createElement('p');
        emptyMsg.textContent = 'No tasks found. Add your first task!';
        taskList.appendChild(emptyMsg);
        return;
      }

      tasks.forEach(task => {
        const taskItem = document.createElement('div');
        taskItem.className = 'task-item';
        taskItem.innerHTML = `
          <h3>${escapeHtml(task.title)}</h3>
          <p>${escapeHtml(task.description)}</p>
          <p><strong>Due:</strong> ${formatDateTime(task.scheduledAt || task.createdAt)}</p>
          <p>Status: ${task.completed ? '✅ Completed' : '🕒 Pending'}</p>
          <div class="task-actions">
            <button class="complete-btn" onclick="toggleCompletion('${escapeHtml(task._id)}', ${task.completed})">
              ${task.completed ? 'Mark Pending' : 'Mark Complete'}
            </button>
            <button class="delete-btn" onclick="deleteTask('${escapeHtml(task._id)}')">Delete</button>
          </div>
        `;
        taskList.appendChild(taskItem);
      });
    }

    // Add new task
    async function addTask() {
      const title = document.getElementById('task-title').value;
      const description = document.getElementById('task-description').value;
      const datetime = document.getElementById('task-datetime').value;

      if (!title || !description) {
        showFormMessage('Please fill in all fields', 'error');
        return;
      }

      try {
        showFormMessage('Adding task...', 'info');
        
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            title,
            description,
            scheduledAt: datetime || new Date().toISOString(),
            completed: false
          }),
        });

        if (!response.ok) {
          throw new Error('Failed to add task');
        }

        // Clear form and refresh list
        taskForm.reset();
        showFormMessage('Task added successfully!', 'success');
        fetchTasks();
      } catch (error) {
        console.error('Error adding task:', error);
        showFormMessage('Failed to add task. Please try again.', 'error');
      }
    }

    // Delete task
    async function deleteTask(taskId) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      
      try {
        const response = await fetch(`${apiUrl}/${taskId}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          throw new Error('Failed to delete task');
        }

        fetchTasks();
      } catch (error) {
        console.error('Error deleting task:', error);
        alert('Failed to delete task. Please try again.');
      }
    }

    // Toggle completion status
    async function toggleCompletion(taskId, currentStatus) {
      try {
        const response = await fetch(`${apiUrl}/${taskId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            completed: !currentStatus
          }),
        });

        if (!response.ok) {
          throw new Error('Failed to update task');
        }

        fetchTasks();
      } catch (error) {
        console.error('Error updating task:', error);
        alert('Failed to update task status. Please try again.');
      }
    }

    // Helper functions
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe.toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateTime(dateString) {
      const options = { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit', 
        minute: '2-digit' 
      };
      return new Date(dateString).toLocaleString(undefined, options);
    }

    function showLoading() {
      loadingMessage.style.display = 'block';
      errorMessage.style.display = 'none';
    }

    function hideLoading() {
      loadingMessage.style.display = 'none';
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function showFormMessage(message, type) {
      formMessage.textContent = message;
      formMessage.style.color = type === 'error' ? 'red' : 
                               type === 'success' ? 'green' : 'blue';
    }
  </script>
</body>
</html>
